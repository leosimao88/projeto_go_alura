# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Integração Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Inicia Banco
      run: docker compose up -d postgres

    - name: Lint
      run: docker run --rm -itv $(pwd):/app -w /app golangci/golangci-lint golangci-lint run controllers/ database/ models/ routes/

    # 3. Espera explicitamente que o serviço 'postgres' esteja pronto para aceitar conexões.
    # Isso evita falhas de conexão nos testes.
    - name: Aguardar o Postgres ficar pronto
      run: |
        for i in $(seq 1 10); do
          if nc -z localhost 5432; then
            echo "Postgres está pronto!"
            exit 0
          fi
          echo "Aguardando o Postgres... ($i/10)"
          sleep 5
        done
        echo "Postgres falhou ao iniciar."
        exit 1
      
    # 4. Executa os testes, passando as credenciais e definindo o host para 'postgres'.
    - name: Testar
      env:
        # 'postgres' é o nome do host do serviço definido acima.
        DB_HOST: ${{ secrets.DB_HOST }} # postgres
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
      run: go test -v ./...


    - name: Projeto compilado
      uses: actions/upload-artifact@v4
      with:
        name: projeto_compilado
        path: main